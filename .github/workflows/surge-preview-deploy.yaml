name: Surge Preview Deploy
on:
  workflow_run:
    workflows: ["Surge Preview Build"]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to Surge
    runs-on: ubuntu-22.04
    # Only deploy successful PR builds. workflow_run always uses this file from the default branch.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
    - name: Download build artifact
      uses: dawidd6/action-download-artifact@v8
      with:
        name: preview-build
        workflow: surge-preview-build.yaml
        run_id: ${{ github.event.workflow_run.id }}
        path: .

    # PR identity comes from the trusted workflow_run event (and GitHub API
    # fallback for fork PRs). Never read pr_number.txt from the artifact.
    - name: Resolve PR number
      id: pr
      env:
        EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        PR_NUMBER="${EVENT_PR_NUMBER:-}"
        if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          PR_NUMBER="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '.[0].number // empty')"
        fi
        if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          echo "Could not resolve a numeric PR number for head_sha=${HEAD_SHA}" >&2
          exit 1
        fi
        echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

    - name: Deploy to Surge
      id: deploy
      env:
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      run: |
        set -euo pipefail
        if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
          echo "Invalid PR number" >&2
          exit 1
        fi
        DEPLOY_DOMAIN="quay-docs-pr-${PR_NUMBER}.surge.sh"
        cd dist
        npx surge . "${DEPLOY_DOMAIN}" --token "${SURGE_TOKEN}"
        echo "url=https://${DEPLOY_DOMAIN}" >> "${GITHUB_OUTPUT}"

    - name: Comment PR with deployment URL
      uses: actions/github-script@v8
      env:
        DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const deploymentUrl = process.env.DEPLOY_URL;
          const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
          const headSha = process.env.HEAD_SHA;

          if (!Number.isInteger(prNumber) || prNumber < 1) {
            throw new Error('Invalid PR number');
          }
          if (!/^https:\/\/quay-docs-pr-\d+\.surge\.sh$/.test(deploymentUrl)) {
            throw new Error('Unexpected deployment URL');
          }

          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            per_page: 100,
          });

          // Map changed book dirs to preview paths (flat + directory).
          // Supports legacy top-level books and JTBD books under quay_jtbd/<category>/.
          const previewPaths = new Set();
          for (const file of files) {
            if (file.filename === 'welcome.adoc' || file.filename === 'build_docs' || file.filename === 'build_docs_preview') {
              previewPaths.add('/');
              continue;
            }
            if (file.filename === 'quay-3-18-navigation.adoc') {
              previewPaths.add('/quay-3-18-navigation.html');
              previewPaths.add('/quay_jtbd-navigation/');
              continue;
            }
            const parts = file.filename.split('/');
            const top = parts[0];
            let flat;
            let dirPath;
            if (top === 'quay_jtbd' && parts.length >= 2) {
              const cat = parts[1];
              flat = `quay_jtbd-${cat}`;
              dirPath = `quay_jtbd/${cat}`;
            } else {
              const book = top === 'api' ? 'api_quay' : top;
              flat = book;
              dirPath = book;
            }
            if (fs.existsSync(path.join('dist', `${flat}.html`))) {
              previewPaths.add(`/${flat}.html`);
            }
            if (fs.existsSync(path.join('dist', dirPath, 'index.html'))) {
              previewPaths.add(`/${dirPath}/`);
            }
          }

          let bookLinks = '';
          if (previewPaths.size > 0) {
            const links = [...previewPaths]
              .sort()
              .map((p) => `- ${deploymentUrl}${p}`)
              .join('\n');
            bookLinks = `\n**Changed book previews:**\n${links}\n`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });

          const botComment = comments.find(comment =>
            comment.user.type === 'Bot' &&
            comment.body.includes('Surge Preview Deployment')
          );

          // Keep every line of this template indented so the YAML `|` block stays valid.
          const commentBody = [
            '## Surge Preview Deployment',
            '',
            '✅ **Preview deployed successfully!**',
            '',
            `🔗 **Preview URL:** ${deploymentUrl}`,
            bookLinks,
            `Built from commit ${headSha}`,
            '',
            '_This preview will be updated on every push to this PR._',
          ].join('\n');

          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });
          }
